
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>歐洲旅行紀錄</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <style>
        .travel-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }
        .travel-card {
            text-align: center;
            width: 300px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .travel-card:hover {
            transform: scale(1.05);
        }
        .travel-card img {
            max-width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }
        .region-title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <nav>
                <a href="index.html">首頁</a>
                <a href="travel.html">返回旅行</a>
            </nav>
        </header>

        <main>
            <h1 class="region-title">歐洲旅行足跡</h1>
            
            <div class="travel-gallery">
                <div v-for="destination in destinations" :key="destination.name" class="travel-card">
                    <a :href="destination.link">
                        <img :src="destination.coverImage" :alt="destination.name + '旅行'">
                        <h3>{{ destination.name }}</h3>
                        <p>{{ destination.description }}</p>
                    </a>
                </div>
            </div>

            <section>
                <h2>關於歐洲</h2>
                <p>歐洲是一個充滿歷史、文化和自然美景的大陸。從北歐的挪威峽灣到地中海的希臘島嶼，從西歐的法國葡萄園到東歐的捷克古城，每個國家都有其獨特的魅力。</p>
                <p>歐洲擁有豐富的藝術遺產、建築奇蹟和美食文化，是世界上最受歡迎的旅遊目的地之一。</p>
            </section>
        </main>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                destinations: [
                    {
                        name: '瑞士',
                        link: 'switzerland.html',
                        coverImage: 'images/switzerland/img1.jpg',
                        description: '阿爾卑斯山的壯麗風光'
                    }
                    // 未來可以添加更多歐洲國家
                ]
            }
        });
    </script>
</body>
</html>
