
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>呂浩維的旅行紀錄</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <style>
        .travel-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }
        .travel-card {
            text-align: center;
            width: 300px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .travel-card:hover {
            transform: scale(1.05);
        }
        .travel-card img {
            max-width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }
        .region-title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <nav>
                <a href="index.html">首頁</a>
                <a href="about.html">關於</a>
                <a href="projects.html">專案</a>
                <a href="resume.html">履歷</a>
                <a href="travel.html">旅行</a>
            </nav>
        </header>

        <main>
            <h1 class="region-title">我的旅行足跡</h1>
            
            <div v-for="(region, regionName) in travelDestinations" :key="regionName">
                <h2 class="region-title">{{ regionName }}</h2>
                <div class="travel-gallery">
                    <div v-for="destination in region" :key="destination.name" class="travel-card">
                        <a :href="destination.link">
                            <img :src="destination.coverImage" :alt="destination.name + '旅行'">
                            <h3>{{ destination.name }}</h3>
                            <p>{{ destination.description }}</p>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                travelDestinations: {
                    '歐洲': [
                        {
                            name: '瑞士',
                            link: 'switzerland.html',
                            coverImage: 'docs/image/switzerland/cover.jpg',
                            description: '阿爾卑斯山的壯麗風光'
                        }
                    ],
                    '亞洲': [
                        {
                            name: '東京',
                            link: 'tokyo.html',
                            coverImage: 'docs/image/japan/cover.jpg',
                            description: '現代與傳統交融的城市'
                        }
                    ]
                }
            }
        });
    </script>
</body>
</html>
