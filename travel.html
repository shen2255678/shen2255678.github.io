
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>呂浩維的旅行紀錄</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .travel-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }
        .travel-card {
            text-align: center;
            width: 300px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .travel-card:hover {
            transform: scale(1.05);
        }
        .travel-card img {
            max-width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }
        .region-title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">首頁</a>
            <a href="about.html">關於</a>
            <a href="projects.html">專案</a>
            <a href="resume.html">履歷</a>
            <a href="travel.html">旅行</a>
        </nav>
    </header>

    <main>
        <h1 class="region-title">我的旅行足跡</h1>
        
        <h2 class="region-title">歐洲</h2>
        <div class="travel-gallery">
            <div class="travel-card">
                <a href="switzerland.html">
                    <img src="images/switzerland/cover.jpg" alt="瑞士旅行">
                    <h3>瑞士</h3>
                    <p>阿爾卑斯山的壯麗風光</p>
                </a>
            </div>
        </div>

        <h2 class="region-title">亞洲</h2>
        <div class="travel-gallery">
            <div class="travel-card">
                <a href="tokyo.html">
                    <img src="images/japan/cover.jpg" alt="東京旅行">
                    <h3>東京</h3>
                    <p>現代與傳統交融的城市</p>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
