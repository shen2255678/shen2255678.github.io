
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>東京旅行紀錄</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .photo-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .photo-gallery img {
            max-width: 300px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }
        .photo-gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">首頁</a>
            <a href="travel.html">返回旅行</a>
        </nav>
    </header>

    <main>
        <h1>東京旅行日記</h1>
        
        <section>
            <h2>旅行概況</h2>
            <p>東京，一個現代與傳統完美交融的世界級都市。高科技與古老文化在這裡共存，展現出獨特的魅力與活力。</p>
        </section>

        <section>
            <h2>旅行相簿</h2>
            <div class="photo-gallery">
                <img src="images/japan/img1.jpg" alt="東京風景1">
                <img src="images/japan/img2.jpg" alt="東京風景2">
                <img src="images/japan/img3.jpg" alt="東京風景3">
                <img src="images/japan/img4.jpg" alt="東京風景4">
                <img src="images/japan/img5.jpg" alt="東京風景5">
            </div>
        </section>

        <section>
            <h2>行程亮點</h2>
            <ul>
                <li>新宿與澀谷的現代都市風光</li>
                <li>淺草寺的傳統文化體驗</li>
                <li>秋葉原的電子文化</li>
                <li>東京鐵塔與晴空塔景觀</li>
                <li>築地市場美食之旅</li>
            </ul>
        </section>
    </main>
</body>
</html>
