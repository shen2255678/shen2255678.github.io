name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20  # 更新為 Node.js 20
          cache: npm
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci --verbose
      
      - name: Debug environment
        run: |
          echo "Node version:"
          node -v
          echo "NPM version:"
          npm -v
          echo "Listing project files:"
          ls -la
          echo "Listing docs directory:"
          ls -la docs
          echo "Checking config file:"
          cat docs/.vitepress/config.js || echo "Config file not found"
      
      - name: Build with VitePress
        run: |
          echo "Building with VitePress..."
          npm run docs:build --verbose
          echo "Adding .nojekyll file..."
          touch docs/.vitepress/dist/.nojekyll
        env:
          DEBUG: vitepress:*
          NODE_OPTIONS: --max-old-space-size=4096
      
      - name: Check build output
        run: |
          echo "Checking build output..."
          if [ -d "docs/.vitepress/dist" ]; then
            echo "Build directory exists, listing files:"
            ls -la docs/.vitepress/dist
          else
            echo "Build directory does not exist!"
            exit 1
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4