name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # Clean install to avoid potential conflicts
      - name: Clean install dependencies
        run: |
          npm ci || npm install
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      
      # Ensure sharp is installed for image processing
      - name: Install Sharp for image processing
        run: npm install sharp --save-dev
      
      # List installed packages for debugging
      - name: List installed packages
        run: npm list --depth=0
      
      # Create necessary directories
      - name: Create VitePress directories
        run: mkdir -p docs/.vitepress/dist
      
      # Debug output
      - name: Debug - Show config files
        run: |
          ls -la docs/.vitepress/
          cat docs/.vitepress/config.mts || echo "Config file not found"
      
      # Build VitePress site with increased memory allocation and verbose logging
      - name: Build
        run: npm run docs:build --loglevel verbose
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      
      # Check build output
      - name: Check build output
        run: ls -la docs/.vitepress/dist
      
      # Upload build artifacts
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
