name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Force cancellation of any running workflow when a new one is triggered
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Shorter timeout to fail fast if there are issues
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # Clean install approach
      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm cache clean --force
          npm install --no-fund --no-audit
      
      # Display versions for debugging
      - name: Display dependency versions
        run: |
          node -v
          npm -v
          npx vitepress --version || echo "VitePress version not available"
      
      # Create specific vitepress.config.js file for build
      - name: Create VitePress config for build
        run: |
          cat > docs/.vitepress/config.js << 'EOF'
          import { defineConfig } from 'vitepress'

          export default defineConfig({
            title: "Haowei's Tech Blog",
            description: "程式開發、AI技術與生活分享的個人博客",
            base: '/',
            themeConfig: {
              nav: [
                { text: '首頁', link: '/' },
                { text: '程式開發', link: '/coding/' },
                { text: 'AI技術', link: '/posts/ai/' },
                { text: '關於', link: '/about' }
              ],
              socialLinks: [
                { icon: 'github', link: 'https://github.com/shen2255678' }
              ]
            }
          })
          EOF
      
      # Create basic theme file
      - name: Setup minimal theme
        run: |
          mkdir -p docs/.vitepress/theme
          cat > docs/.vitepress/theme/index.js << 'EOF'
          import DefaultTheme from 'vitepress/theme'
          export default {
            ...DefaultTheme
          }
          EOF
      
      # Build with extra options to diagnose issues
      - name: Build
        run: |
          echo "Starting build process..."
          npm run docs:build -- --debug
        env:
          NODE_OPTIONS: "--max-old-space-size=4096 --no-warnings"
          DEBUG: "vitepress:*"
      
      # List files in dist directory to ensure build completed
      - name: Verify build output
        run: |
          if [ -d "docs/.vitepress/dist" ]; then
            echo "Build succeeded - output directory exists"
            ls -la docs/.vitepress/dist
          else
            echo "Build failed - output directory does not exist"
            exit 1
          fi
      
      # Upload build artifacts
      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
