name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 設置 GITHUB_TOKEN 權限以允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允許一個並發部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 構建工作
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 設置明確的超時時間避免無限執行
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # 清理安裝以避免潛在衝突
      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install
      
      # 創建必要的目錄
      - name: Create VitePress directories
        run: mkdir -p docs/.vitepress/dist
      
      # 構建 VitePress 站點 - 添加 --force 選項跳過一些可能導致超時的檢查
      - name: Build
        run: npm run docs:build -- --force
        env:
          NODE_OPTIONS: --max-old-space-size=4096 --max-http-header-size=16384
          # 添加環境變數以改善構建過程
          VITE_CJS_IGNORE_WARNING: true
          VITE_CJS_TRACE: false
      
      # 檢查構建輸出
      - name: Check build output
        run: ls -la docs/.vitepress/dist
      
      # 上傳構建產物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # 部署工作
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 部署不應該需要太長時間
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000  # 增加部署超時時間（毫秒）
