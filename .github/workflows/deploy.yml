name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Force cancellation of any running workflow when a new one is triggered
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Shorter timeout to fail fast if there are issues
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper last updated times
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # Clean install dependencies
      - name: Install dependencies
        run: |
          npm ci

      # Install additional theme packages if needed
      - name: Install theme packages
        run: |
          if ! npm list vitepress-theme-open17; then
            npm install vitepress-theme-open17 --no-fund --no-audit
          fi
      
      # Display versions for debugging
      - name: Display dependency versions
        run: |
          node -v
          npm -v
          npx vitepress --version || echo "VitePress version not available"
          ls -la node_modules/vitepress-theme-open17 || echo "Theme not installed"
      
      # Build site
      - name: Build
        run: |
          echo "Starting build process..."
          npm run docs:build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096 --no-warnings"
          DEBUG: "vitepress:*"
      
      # List files in dist directory to ensure build completed
      - name: Verify build output
        run: |
          if [ -d "docs/.vitepress/dist" ]; then
            echo "Build succeeded - output directory exists"
            ls -la docs/.vitepress/dist
          else
            echo "Build failed - output directory does not exist"
            exit 1
          fi
      
      # Upload build artifacts
      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4