name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # Clean install to avoid potential conflicts
      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install
      
      # Debug information
      - name: VitePress version check
        run: npx vitepress --version
      
      # Create necessary directories
      - name: Create VitePress directories
        run: mkdir -p docs/.vitepress/dist
      
      # Copy config to ensure it's found
      - name: Copy config files
        run: |
          ls -la docs/.vitepress/
          cat docs/.vitepress/config.mjs
      
      # Build VitePress site with debugging
      - name: Build
        run: |
          echo "Building site..."
          npm run docs:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096 --trace-warnings
          DEBUG: vitepress*
      
      # Check build output
      - name: Check build output
        run: ls -la docs/.vitepress/dist
      
      # Upload build artifacts
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
