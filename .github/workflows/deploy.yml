name: Deploy VitePress site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      
      - name: Setup Pages
        uses: actions/configure-pages@v3
      
      # Clean install to avoid potential conflicts
      - name: Clean install
        run: rm -rf node_modules package-lock.json
      
      # Install dependencies with clean npm install
      - name: Install dependencies
        run: npm install
      
      # Ensure sharp is installed for image processing
      - name: Install Sharp for image processing
        run: npm install sharp --save-dev
      
      # List installed packages for debugging
      - name: List installed packages
        run: npm list --depth=0
      
      # Create necessary directories
      - name: Create VitePress directories
        run: mkdir -p docs/.vitepress/dist
      
      # Build VitePress site with increased memory allocation
      - name: Build
        run: npm run docs:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      
      # Upload build artifacts
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2