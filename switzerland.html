
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>瑞士旅行紀錄</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .photo-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .photo-gallery img {
            max-width: 300px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }
        .photo-gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">首頁</a>
            <a href="travel.html">返回旅行</a>
        </nav>
    </header>

    <main>
        <h1>瑞士旅行日記</h1>
        
        <section>
            <h2>旅行概況</h2>
            <p>瑞士，一個令人著迷的阿爾卑斯山國度，以其壯麗的山景、精緻的鐘錶和美味的巧克力而聞名。</p>
        </section>

        <section>
            <h2>旅行相簿</h2>
            <div class="photo-gallery">
                <img src="images/switzerland/img1.jpg" alt="瑞士風景1">
                <img src="images/switzerland/img2.jpg" alt="瑞士風景2">
                <img src="images/switzerland/img3.jpg" alt="瑞士風景3">
                <img src="images/switzerland/img4.jpg" alt="瑞士風景4">
                <img src="images/switzerland/img5.jpg" alt="瑞士風景5">
            </div>
        </section>

        <section>
            <h2>行程亮點</h2>
            <ul>
                <li>策馬特滑雪勝地</li>
                <li>琉森湖風景</li>
                <li>茵特拉根山區</li>
                <li>蘇黎世城市風光</li>
            </ul>
        </section>
    </main>
</body>
</html>
