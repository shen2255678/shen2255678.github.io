
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>瑞士旅行紀錄</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <style>
        .photo-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .photo-gallery img {
            max-width: 300px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }
        .photo-gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <nav>
                <a href="index.html">首頁</a>
                <a href="travel.html">返回旅行</a>
            </nav>
        </header>

        <main>
            <h1>{{ title }}</h1>
            
            <section>
                <h2>旅行概況</h2>
                <p>{{ description }}</p>
            </section>

            <section>
                <h2>旅行相簿</h2>
                <div class="photo-gallery">
                    <img v-for="(image, index) in images" 
                         :key="index" 
                         :src="image.src" 
                         :alt="image.alt">
                </div>
            </section>

            <section>
                <h2>行程亮點</h2>
                <ul>
                    <li v-for="(highlight, index) in highlights" :key="index">
                        {{ highlight }}
                    </li>
                </ul>
            </section>
        </main>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                title: '瑞士旅行日記',
                description: '瑞士，一個令人著迷的阿爾卑斯山國度，以其壯麗的山景、精緻的鐘錶和美味的巧克力而聞名。',
                images: [
                    { src: 'images/switzerland/img1.jpg', alt: '瑞士風景1' },
                    { src: 'images/switzerland/img2.jpg', alt: '瑞士風景2' },
                    { src: 'images/switzerland/img3.jpg', alt: '瑞士風景3' },
                    { src: 'images/switzerland/img4.jpg', alt: '瑞士風景4' },
                    { src: 'images/switzerland/img5.jpg', alt: '瑞士風景5' }
                ],
                highlights: [
                    '策馬特滑雪勝地',
                    '琉森湖風景',
                    '茵特拉根山區',
                    '蘇黎世城市風光'
                ]
            }
        });
    </script>
</body>
</html>
