<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行攝影</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 基礎樣式 */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #fff;
        }
        
        /* 移除所有超連結的底線 */
        a {
            text-decoration: none !important;
        }
        
        /* 主內容區背景 */
        .main-container {
            background-color: #f5f5f5;
            border-radius: 8px;
            padding: 50px 30px;
            margin: 20px 0;
            text-align: center;
        }
        
        /* 按鈕通用樣式 */
        .btn {
            display: inline-block;
            min-width: 200px;
            height: 50px;
            line-height: 50px;
            padding: 0 20px;
            border-radius: 50px;
            text-decoration: none;
            text-align: center;
            font-weight: normal;
            margin: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: relative;
            color: white;
        }
        
        /* 主要按鈕樣式（深綠色替代藍色，適合旅行主題） */
        .btn-primary {
            background-color: #10b981; /* 綠松石色 */
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            background-color: #059669; /* 更深的綠色 */
        }
        
        /* 橙色高亮按鈕 */
        .btn-orange {
            background-color: #f97316; /* 調整為更協調的橙色 */
            position: relative;
        }
        
        .btn-orange:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            background-color: #ea580c; /* 深橙色 */
        }
        
        /* NEW標籤樣式 */
        .btn-orange::after {
            content: "NEW";
            position: absolute;
            top: -12px;
            right: -12px;
            background-color: #facc15; /* 調整黃色 */
            color: #111;
            font-size: 12px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 30px;
            transform: rotate(8deg);
            z-index: 2;
        }
        
        /* 樣式應用於所有頁面導航連結 */
        header {
            background-color: #0f766e; /* 深綠藍色，旅行主題 */
        }
        
        header nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
            opacity: 0.9;
            transition: opacity 0.2s;
        }
        
        header nav a:hover {
            opacity: 1;
            color: #facc15; /* 金黃色 */
        }
        
        /* 頁面標題 */
        h1 {
            color: #115e59; /* 配合旅行主題的深綠色 */
            margin-bottom: 40px;
        }
        
        /* 描述文字 */
        .description {
            margin-bottom: 35px;
            font-size: 1.1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header class="py-4">
        <nav class="flex justify-center space-x-6">
            <a href="../index.html">首頁</a>
            <a href="../travel.html">所有旅行</a>
        </nav>
    </header>
    
    <main class="max-w-6xl mx-auto px-4 py-8">
        <h1 class="text-4xl text-center font-bold">旅行攝影</h1>
        
        <div class="main-container">
            <p class="description">探索我在各地拍攝的精選照片，捕捉世界各地的美麗風景和文化。</p>
            
            <div class="button-container">
                <a href="../switzerland.html" class="btn btn-primary">瑞士照片集</a>
                <a href="../japan.html" class="btn btn-primary">日本照片集</a>
                <a href="gallery.html" class="btn btn-orange">照片畫廊示例</a>
            </div>
        </div>
    </main>

    <script>
        // 確保所有鏈接沒有底線
        document.addEventListener('DOMContentLoaded', function() {
            const allLinks = document.querySelectorAll('a');
            allLinks.forEach(link => {
                link.style.textDecoration = 'none';
            });
        });
    </script>
</body>
</html>
