<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行攝影</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        
        header {
            background-color: #333;
            color: white;
            padding: 1rem 0;
            text-align: center;
        }
        
        nav {
            display: flex;
            justify-content: center;
            padding: 0.5rem;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .travel-container {
            background-color: #f5f5f5;
            padding: 30px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
        
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }
        
        /* 修正按鈕的CSS問題 */
        .travel-button {
            display: inline-block;
            min-width: 200px;
            height: 60px;
            line-height: 60px;
            text-align: center;
            background-color: #3f51b5;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            padding: 0 20px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            /* 確保文字不會被截斷 */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .travel-button:hover {
            background-color: #303f9f;
            transform: scale(1.05);
        }
        
        .orange-button {
            background-color: #ff5722;
        }
        
        .orange-button:hover {
            background-color: #e64a19;
        }
        
        /* 手機版響應式設計 */
        @media (max-width: 768px) {
            .button-container {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            
            .travel-button {
                width: 80%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">首頁</a>
            <a href="../travel.html">所有旅行</a>
        </nav>
    </header>
    
    <main>
        <h1>旅行攝影</h1>
        
        <div class="travel-container">
            <p>探索我在各地拍攝的精選照片，捕捉世界各地的美麗風景和文化。</p>
            
            <div class="button-container">
                <a href="landscape.html" class="travel-button">風景攝影</a>
                <a href="culture.html" class="travel-button">人文攝影</a>
                <a href="gallery.html" class="travel-button orange-button">照片畫廊示例</a>
            </div>
        </div>
    </main>
</body>
</html>
