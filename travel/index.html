<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行攝影</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 基礎樣式 */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        
        /* 按鈕通用樣式 */
        .btn {
            @apply inline-flex items-center justify-center px-5 py-3 font-medium rounded-full transition-all duration-300;
            min-width: 200px;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* 主要藍色按鈕 */
        .btn-primary {
            @apply bg-blue-700 text-white hover:bg-blue-800;
        }
        
        /* 橙色高亮按鈕 */
        .btn-highlight {
            @apply bg-orange-500 text-white hover:bg-orange-600 relative;
        }
        
        /* NEW標籤樣式 */
        .btn-highlight::after {
            content: "NEW";
            @apply absolute -top-2 -right-2 bg-yellow-300 text-gray-800 text-xs font-bold py-0.5 px-1.5 rounded transform rotate-12 z-20;
        }
    </style>
</head>
<body class="bg-gray-50">
    <header class="bg-gray-800 text-white py-4">
        <nav class="flex justify-center space-x-6">
            <a href="../index.html" class="font-medium hover:text-gray-300">首頁</a>
            <a href="../travel.html" class="font-medium hover:text-gray-300">所有旅行</a>
        </nav>
    </header>
    
    <main class="max-w-6xl mx-auto px-4 py-8">
        <h1 class="text-4xl text-center font-bold mb-10">旅行攝影</h1>
        
        <div class="bg-white p-8 rounded-lg shadow-sm">
            <p class="text-center text-lg mb-8">探索我在各地拍攝的精選照片，捕捉世界各地的美麗風景和文化。</p>
            
            <div class="flex flex-wrap justify-center gap-6">
                <a href="landscape.html" class="btn btn-primary">風景攝影</a>
                <a href="culture.html" class="btn btn-primary">人文攝影</a>
                <a href="gallery.html" class="btn btn-highlight">照片畫廊示例</a>
            </div>
        </div>
    </main>

    <script>
        // 確保Tailwind CSS正確加載
        if (typeof tailwind === 'undefined') {
            console.log('Tailwind CSS未正確加載，使用備用樣式');
            document.head.insertAdjacentHTML('beforeend', `
                <style>
                    .btn {
                        display: inline-flex;
                        align-items: center;
                        justify-content: center;
                        min-width: 200px;
                        padding: 0.75rem 1.25rem;
                        font-weight: 500;
                        border-radius: 9999px;
                        transition: all 0.3s;
                        text-decoration: none;
                        white-space: nowrap;
                        overflow: hidden;
                        text-overflow: ellipsis;
                    }
                    
                    .btn-primary {
                        background-color: #3f51b5;
                        color: white;
                    }
                    
                    .btn-primary:hover {
                        background-color: #303f9f;
                    }
                    
                    .btn-highlight {
                        background-color: #ff5722;
                        color: white;
                        position: relative;
                    }
                    
                    .btn-highlight:hover {
                        background-color: #e64a19;
                    }
                    
                    .btn-highlight::after {
                        content: "NEW";
                        position: absolute;
                        top: -8px;
                        right: -8px;
                        background-color: #ffeb3b;
                        color: #333;
                        font-size: 0.6rem;
                        font-weight: bold;
                        padding: 2px 5px;
                        border-radius: 2px;
                        transform: rotate(12deg);
                        z-index: 20;
                    }
                </style>
            `);
        }
    </script>
</body>
</html>
