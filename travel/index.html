<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行攝影</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 基礎樣式 */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        
        /* 移除所有超連結的底線 */
        a {
            text-decoration: none !important;
        }
        
        /* 按鈕通用樣式 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 200px;
            height: 60px;
            padding: 0 20px;
            font-weight: 500;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-decoration: none;
            white-space: nowrap;
            overflow: visible; /* 改為 visible 確保內容不被裁剪 */
            text-align: center;
            color: white;
            margin: 0 10px;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        /* 主要藍色按鈕 */
        .btn-primary {
            background-color: #4263eb;
            position: relative;
            z-index: 1;
        }
        
        .btn-primary:hover {
            background-color: #3b5bdb;
            transform: translateY(-3px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        
        /* 橙色高亮按鈕 */
        .btn-highlight {
            background-color: #ff5722;
            position: relative;
        }
        
        .btn-highlight:hover {
            background-color: #e64a19;
            transform: translateY(-3px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        
        /* NEW標籤樣式 */
        .btn-highlight::after {
            content: "NEW";
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: #ffeb3b;
            color: #333;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            transform: rotate(12deg);
            z-index: 2;
        }
        
        /* 樣式應用於所有頁面導航連結 */
        header nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
            opacity: 0.9;
            transition: opacity 0.2s;
        }
        
        header nav a:hover {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-50">
    <header class="bg-gray-800 text-white py-4">
        <nav class="flex justify-center space-x-6">
            <a href="../index.html">首頁</a>
            <a href="../travel.html">所有旅行</a>
        </nav>
    </header>
    
    <main class="max-w-6xl mx-auto px-4 py-8">
        <h1 class="text-4xl text-center font-bold mb-10">旅行攝影</h1>
        
        <div class="bg-white p-8 rounded-lg shadow-sm">
            <p class="text-center text-lg mb-8">探索我在各地拍攝的精選照片，捕捉世界各地的美麗風景和文化。</p>
            
            <div class="flex flex-wrap justify-center gap-6 my-4">
                <a href="landscape.html" class="btn btn-primary">風景攝影</a>
                <a href="culture.html" class="btn btn-primary">人文攝影</a>
                <a href="gallery.html" class="btn btn-highlight">照片畫廊示例</a>
            </div>
        </div>
    </main>

    <script>
        // 確保所有鏈接沒有底線
        document.addEventListener('DOMContentLoaded', function() {
            const allLinks = document.querySelectorAll('a');
            allLinks.forEach(link => {
                link.style.textDecoration = 'none';
            });
        });
    </script>
</body>
</html>
